# /etc/nginx/sites-available/campus
# Primary public demo: https://campus.mxd.wtf
# nginx terminates TLS on 443; gunicorn listens on 127.0.0.1:5000.

server {
    listen 80;
    listen [::]:80;
    server_name campus.mxd.wtf;
    root /var/www/html;

    # certbot webroot; keep this path available for renewals.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name campus.mxd.wtf;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/campus.mxd.wtf/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/campus.mxd.wtf/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/campus;
    index index.html;
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    access_log /var/log/nginx/campus.access.log;
    error_log /var/log/nginx/campus.error.log;

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 60s;
    }

    location = /index.html {
        expires -1;
        include /etc/nginx/snippets/campus-security-headers.conf;
    }

    location /assets/ {
        expires 1y;
        try_files $uri =404;
        include /etc/nginx/snippets/campus-security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/campus-security-headers.conf;
    }
}
