# /etc/nginx/sites-available/campus
# Public demo: https://finland.meowxd.net:8080
# Port 443 belongs to the host VPN; 8080 is the published demo port.

server {
    listen 80;
    listen [::]:80;
    server_name finland.meowxd.net;

    # certbot uses the webroot authenticator for this hostname.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        return 301 https://$host:8080$request_uri;
    }
}

server {
    listen 8080 ssl;
    listen [::]:8080 ssl;
    http2 on;
    server_name finland.meowxd.net;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/finland.meowxd.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/finland.meowxd.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/campus;
    index index.html;
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    access_log /var/log/nginx/campus.access.log;
    error_log /var/log/nginx/campus.error.log;

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 100s;
    }

    location = /index.html {
        expires -1;
        include /etc/nginx/snippets/campus-security-headers.conf;
    }

    location /assets/ {
        expires 1y;
        try_files $uri =404;
        include /etc/nginx/snippets/campus-security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/campus-security-headers.conf;
    }
}
